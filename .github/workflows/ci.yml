name: FCEA validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research-local:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check generated schemas, examples and catalogues
        run: python scripts/generate_artifacts.py --check
      - name: Full tests and ten proof replays
        run: python scripts/validate.py --output validation-output
      - name: Verify isolated package installation
        run: |
          python -m pip install -r requirements-build.txt
          python scripts/check_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-python-${{ matrix.python }}
          path: validation-output/
          retention-days: 30
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and verify container lifecycle
        run: python scripts/check_container.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install browser test tooling
        run: |
          npm install --prefix .browser-test --no-save --no-package-lock playwright@1.62.1
          node .browser-test/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser workflow, role checks and downloaded proof replay
        env:
          NODE_PATH: ${{ github.workspace }}/.browser-test/node_modules
        run: node scripts/check_browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-acceptance
          path: validation-output/browser/
          retention-days: 30
